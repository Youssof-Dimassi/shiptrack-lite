<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password · ShipTrack Lite</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="password.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <svg viewBox="0 0 28 28" aria-hidden="true">
                    <rect width="28" height="28" rx="6" fill="#0f2439"/>
                    <path d="M14 6l7 4v8l-7 4-7-4v-8z M7 10l7 4 7-4 M14 14v8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
                </svg>
                ShipTrack Lite
            </a>
            <nav class="site-nav" aria-label="Main">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/login">Log in</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <form id="forgot-form" class="auth-form">
            <h1>Forgot your password?</h1>
            <p class="auth-note">Enter your email and we'll send you a link to choose a new one.</p>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <p class="form-error" role="alert" hidden></p>

            <button type="submit">Send reset link</button>

            <p class="form-switch"><a href="/login">Back to log in</a></p>
        </form>

        <section id="done" class="auth-form" hidden>
            <h1>Check your email</h1>
            <p class="auth-note"></p>
            <p class="form-switch"><a href="/login">Back to log in</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 ShipTrack Lite</p>
        </div>
    </footer>
</body>
</html>
