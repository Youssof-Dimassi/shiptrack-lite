<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My shipments · ShipTrack Lite</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js" defer></script>
    <script src="my-shipments.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <svg viewBox="0 0 28 28" aria-hidden="true">
                    <rect width="28" height="28" rx="6" fill="#0f2439"/>
                    <path d="M14 6l7 4v8l-7 4-7-4v-8z M7 10l7 4 7-4 M14 14v8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
                </svg>
                ShipTrack Lite
            </a>
            <nav class="site-nav" aria-label="Main">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li id="account-nav"><a href="/login">Log in</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="my-page">
        <div class="container my-container">
            <h1>My shipments</h1>

            <p id="my-loading" class="admin-note">Loading…</p>

            <div id="my-app" hidden>
                <form id="add-form" class="my-add">
                    <label for="add-number">Add a shipment</label>
                    <div class="my-add-row">
                        <input type="text" id="add-number" name="trackingNumber"
                            placeholder="Tracking number" autocomplete="off" required>
                        <button type="submit">Add shipment</button>
                    </div>
                    <p class="form-error" role="alert" hidden></p>
                </form>

                <ul id="saved-list" class="saved-list"></ul>
                <p id="my-empty" class="my-empty" hidden>No saved shipments yet. Add one above with its tracking number.</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 ShipTrack Lite</p>
        </div>
    </footer>
</body>
</html>
