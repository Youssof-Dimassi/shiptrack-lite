<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipTrack Lite</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header id="home">
        <h1>ShipTrack Lite</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#track">Track</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>
    <main id="track">
            <h2>Track Your Shipment</h2>
            <form id="track-form">
                <label for="tracking-number">Tracking Number:</label>
                <input type="text"
                    id="tracking-number"
                    name="tracking-number"
                    placeholder="e.g. ST10000001"
                    autocomplete="off"
                    required>
                <button type="submit">Track Shipment</button>
            </form>
            <div id="result" aria-live="polite"></div>
            <section id="about">
            <h3>Real-Time Tracking</h3>
            <p>Track your shipment and follow its progress.</p>

            <h3>Fast Delivery</h3>
            <p>Get your packages delivered quickly and efficiently.</p>

            <h3>Secure Shipments</h3>
            <p>Your packages are handled with care and security.</p>
            </section>
    </main>
    <footer>
        <p>&copy; 2026 ShipTrack Lite</p>
    </footer>
</body>
</html>
