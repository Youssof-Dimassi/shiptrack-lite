<!-- title: Confirm your new email -->
<!-- scripts: forms.js -->

    <main class="auth-page">
        <section id="link-action" class="auth-form" aria-live="polite"
            data-endpoint="/api/account/confirm-email-change"
            data-success-title="Email changed"
            data-success-note=""
            data-error-note="You can request a new link from Account settings.">
            <h1 id="link-title">Changing your email…</h1>
            <p id="link-text" class="auth-note">This will only take a moment.</p>
            <p class="form-switch"><a href="/account">Go to Account settings</a></p>
        </section>
    </main>
