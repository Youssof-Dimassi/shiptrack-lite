<!-- title: My shipments -->
<!-- scripts: my-shipments.js -->

    <main class="my-page">
        <div class="container my-container">
            <h1>My shipments</h1>

            <p id="my-loading" class="admin-note">Loading…</p>

            <div id="confirm-banner" class="confirm-banner" hidden>
                <p id="confirm-banner-text">Please confirm your email address. We sent you a link when you signed up.</p>
                <button type="button" id="resend-confirmation" class="button-secondary">Send a new link</button>
            </div>

            <div id="my-app" hidden>
                <section id="notify-panel" class="notify-panel" hidden>
                    <label class="toggle">
                        <input type="checkbox" id="notify-toggle">
                        Email me when my saved shipments are updated
                    </label>
                    <p id="notify-note" class="notify-note" hidden></p>
                </section>

                <form id="add-form" class="my-add">
                    <label for="add-number">Add a shipment</label>
                    <div class="my-add-row">
                        <input type="text" id="add-number" name="trackingNumber"
                            placeholder="Tracking number" autocomplete="off" required>
                        <button type="submit">Add shipment</button>
                    </div>
                    <p class="form-error" role="alert" hidden></p>
                </form>

                <ul id="saved-list" class="saved-list"></ul>
                <p id="my-empty" class="my-empty" hidden>No saved shipments yet. Add one above with its tracking number.</p>
            </div>
        </div>
    </main>
